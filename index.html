<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Operations Management</title>
<meta name="description" content="AI Operations Management: the textbook and the discipline.">
<style>
  :root { --bg: #fbfaf7; --ink: #1d1d1b; --muted: #5b5a55; --accent: #1f4e79; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --ink: #ecebe6; --muted: #a9a8a2; --accent: #8fb8e0; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: Georgia, "Times New Roman", serif; line-height: 1.5;
         min-height: 100vh; display: grid; place-items: center; padding: 0 16px; }
  main { max-width: 36rem; padding: 4rem 0; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; margin: 0 0 1rem; }
  p { font-size: 1.15rem; color: var(--muted); margin: 0 0 2rem; }
  a.button { display: inline-block; padding: 0.75rem 1.25rem; border: 2px solid var(--accent);
             color: var(--accent); text-decoration: none; font-family: system-ui, sans-serif;
             font-weight: 600; }
  a.button:hover, a.button:focus { background: var(--accent); color: var(--bg); }
</style>
</head>
<body>
<main>
  <h1>AI Operations Management</h1>
  <p>A new home for the discipline is being built here. The textbook is open now.</p>
  <a class="button" href="https://textbook.aioperationsmanagement.ai/">Read the textbook</a>
</main>
</body>
</html>
